[[local|localrc]]

# ============================================================
# DevStack Local Configuration
# CyberAlam Solutions — Testing Environment
# Maintainer: Jamal Doe (@jdoe-devops)
# Last updated: 2026-03-12
# ============================================================

# ---- Host Configuration ----
HOST_IP=10.200.1.10
SERVICE_HOST=$HOST_IP
MYSQL_HOST=$HOST_IP
RABBIT_HOST=$HOST_IP
GLANCE_HOSTPORT=$HOST_IP:9292

# ---- Admin Credentials ----
ADMIN_PASSWORD=CyberAl4m_D3v2026!
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD
SERVICE_TOKEN=CyberAl4m_S3rv1c3_T0k3n

# ---- Networking (Neutron) ----
disable_service n-net
enable_service q-svc q-agt q-dhcp q-l3 q-meta neutron

# Flat network for internal lab
Q_USE_PROVIDERNET_FOR_PUBLIC=True
OVS_PHYSICAL_BRIDGE=br-ex
PUBLIC_BRIDGE=br-ex
OVS_BRIDGE_MAPPINGS=public:br-ex

# Shah Alam Lab Network Ranges
FLOATING_RANGE="10.200.0.0/24"
PUBLIC_NETWORK_GATEWAY="10.200.0.1"
Q_FLOATING_ALLOCATION_POOL=start=10.200.0.100,end=10.200.0.200
FIXED_RANGE="192.168.100.0/24"
NETWORK_GATEWAY="192.168.100.1"

# ---- Services ----
enable_service horizon
enable_service heat h-api h-api-cfn h-eng
enable_service s-proxy s-object s-container s-account

# ---- Logging ----
LOGFILE=/opt/stack/logs/stack.sh.log
VERBOSE=True
LOG_COLOR=True
SCREEN_LOGDIR=/opt/stack/logs

# ---- Image Configuration ----
# Use Ubuntu 22.04 cloud image for testing VMs
IMAGE_URL_SITE="https://cloud-images.ubuntu.com/jammy/current"
IMAGE_URL_FILE="jammy-server-cloudimg-amd64.img"

# ---- Tempest (Integration Tests) ----
enable_service tempest

# ---- Custom ----
# SOC Engine testing VM will use floating IP from the pool above.
# After deployment, run the engine with:
#   python -m src.engine --config config/settings.yaml
#
# NOTE: The IRENE analysis modules should be deployed separately
# on the isolated forensics VLAN (10.200.2.0/24). See infra/pfsense
# for the firewall rules controlling inter-VLAN routing.
